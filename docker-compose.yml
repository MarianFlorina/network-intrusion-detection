name: network-ids

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://nad_user:nad_password@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Pipeline connections
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: network_ids
    POSTGRES_USER: nad_user
    POSTGRES_PASSWORD: nad_password
    DATABASE_URL: postgresql+psycopg2://nad_user:nad_password@postgres:5432/network_ids
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-data:/opt/airflow/data
    - airflow-models:/opt/airflow/models
  depends_on:
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_started
  networks:
    - nad-net

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nad_user
      POSTGRES_PASSWORD: nad_password
      POSTGRES_DB: network_ids
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nad_user -d network_ids"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nad-net

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://nad_user:nad_password@postgres:5432/mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - nad-net

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg2://nad_user:nad_password@postgres:5432/network_ids
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - nad-net

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    environment:
      DATABASE_URL: postgresql+psycopg2://nad_user:nad_password@postgres:5432/network_ids
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - nad-net

networks:
  nad-net:

volumes:
  postgres-data:
  mlflow-artifacts:
  airflow-data:
  airflow-models:
